<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <title>ログイン・アカウント登録</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>

  <style>
    /* 既存のスタイルをベースに、アコーディオンと細身のボタンを追加 */
    body { font-family: sans-serif; background-color: #f4f4f4; margin: 0; }
    .wrapper { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .login-container { background-color: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; max-width: 380px; width: 100%; }
    
    h2 { color: #333; margin-bottom: 20px; font-size: 22px; }
    input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
    
    /* 通常ボタン */
    .btn-main { background-color: #808080; color: white; padding: 14px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-top: 10px; }
    .btn-main:hover { background-color: #004080; }

    /* 細身のボタン */
    .btn-slim { background-color: #fff; color: #555; padding: 8px; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; font-size: 14px; width: 100%; margin: 10px 0; display: block; text-decoration: none; }
    .btn-slim:hover { background-color: #f9f9f9; }

    hr { border: 0; border-top: 1px solid #eee; margin: 20px 0; }
    .info-text { font-size: 13px; color: #666; margin: 20px 0 10px; text-align: left; line-height: 1.6; }
    
    /* アコーディオン */
    .accordion-content { display: none; text-align: left; border-top: 1px dashed #ddd; padding-top: 10px; }
    .message { color: red; font-size: 14px; margin-top: 10px; min-height: 1.5em; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="login-container">
      <h2>ログイン</h2>
      
      <input type="text" id="loginAccount" placeholder="アカウント名" required>
      <input type="password" id="loginPass" placeholder="パスワード" required>
      <button class="btn-main" onclick="doLogin()">ログイン</button>
      <div id="loginMessage" class="message"></div>

      <div class="info-text">
        【デジタル版閲覧について】<br>
        下記よりアカウント登録をしてご利用ください。
      </div>

      <button class="btn-slim" onclick="toggleAccordion()">購読契約中の方はこちら（アカウント登録）</button>
      <div id="activateAccordion" class="accordion-content">
        <input type="text" id="regAccount" placeholder="希望アカウント名（ログイン用）">
  <input type="email" id="regEmail" placeholder="メールアドレス（Firebase登録用）">
  <input type="password" id="regPass" placeholder="パスワード">
  <input type="password" id="regPassConfirm" placeholder="確認用パスワード">
  <input type="text" id="activateCode" placeholder="アクティベートコード（郵送封書のキー）">
  <button class="btn-main" onclick="doActivate()">アカウント作成</button>
      </div>

      <hr>

      <a href="register.html" class="btn-slim">新規購読申込はこちら</a>
    </div>
  </div>

  <script>
    // --- Firebase初期化（既存設定を使用） ---
    const firebaseConfig = {
      apiKey: "AIzaSyAJT3EnF4s6kfU6RuC9nJvOrs9FtG_RMR0",
      authDomain: "economic-journals-digital.firebaseapp.com",
      projectId: "economic-journals-digital",
      storageBucket: "economic-journals-digital.firebasestorage.app",
      messagingSenderId: "1032175762907",
      appId: "1:1032175762907:web:e46fca907bb52c9b5fbbfe"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // GASのURL（Base64）
    const SHARED_KEY = 'aHR0cHM6Ly9zY3JpcHQuZ29vZ2xlLmNvbS9tYWNyb3Mvcy9BS2Z5Y2J3UGI2eHlGOWFHWW1TNm1nQlVpeWpObGJjbFBnQXVPYWUyZG1VWlFwbGVRdDZBSW5ocjcxUjdxX1FSd1loSGl1QlAvZXhlYw===';

    function toggleAccordion() {
      const content = document.getElementById('activateAccordion');
      content.style.display = (content.style.display === 'block') ? 'none' : 'block';
    }

    // --- ログイン処理（アカウント名からメルアドを逆引き） ---
    async function doLogin() {
  const accountId = document.getElementById('loginAccount').value.trim();
  const pass = document.getElementById('loginPass').value;
  const msg = document.getElementById('loginMessage');

  if (!accountId || !pass) {
    msg.textContent = "未入力項目があります";
    return;
  }

  msg.textContent = "認証中...";
  console.log('[login] accountId =', accountId);

  try {
    const gasUrl = GAS_URL; // 直書き推奨
    const response = await fetch(`${gasUrl}?action=getEmail&accountId=${encodeURIComponent(accountId)}`);
    const result = await response.json();

    console.log('[login] getEmail result =', result);

    if (!result.email) {
      msg.textContent = "アカウントが見つかりません。";
      return;
    }

    const cred = await auth.signInWithEmailAndPassword(result.email, pass);
    console.log('[login] firebase signIn success uid =', cred.user.uid);

    location.href = 'index.html';
  } catch (e) {
    console.error('[login] error =', e);
    msg.textContent = "ログインに失敗しました。";
  }
}

    // --- アカウント作成（アクティベート処理） ---
    async function doActivate() {
  const accountId = document.getElementById('regAccount').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const pass = document.getElementById('regPass').value;
  const passConf = document.getElementById('regPassConfirm').value;
  const code = document.getElementById('activateCode').value.trim().toUpperCase();
  const msg = document.getElementById('loginMessage');

  if (!accountId || !email || !pass || !passConf || !code) {
    msg.textContent = "全ての項目を入力してください";
    return;
  }
  if (pass !== passConf) {
    msg.textContent = "パスワードが一致しません";
    return;
  }

  msg.textContent = "アカウント作成中...";

  let userCredential = null;

  try {
    userCredential = await auth.createUserWithEmailAndPassword(email, pass);
    const uid = userCredential.user.uid;

    const response = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'activate',
        accountId,
        email,
        activateCode: code,
        uid
      })
    });

    const resultText = await response.text();
    console.log('activate result:', resultText);

    if (resultText.includes("ACTIVATE_SUCCESS")) {
      alert("アカウント作成と紐付けが完了しました。");
      location.href = 'index.html';
    } else {
      await userCredential.user.delete();
      msg.textContent = "アクティベートコードが正しくありません。";
    }

  } catch (error) {
    console.error(error);
    msg.textContent = "エラー: " + error.message;
  }
}
</script>
</body>
</html>
